<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>ZK Attendance: connection settings</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
  main { padding: 24px 28px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; color: #64748b; font-size: 13px; }
  fieldset { border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; padding: 14px 16px 6px; margin: 0 0 14px; }
  legend { font-weight: 600; font-size: 13px; padding: 0 6px; color: #334155; }
  .row { display: grid; grid-template-columns: 1fr 110px; gap: 12px; }
  label { display: block; margin-bottom: 10px; }
  label span { display: block; font-size: 12px; font-weight: 500; color: #475569; margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; background: #fff; }
  input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px #dcfce7; }
  small { display: block; color: #94a3b8; font-size: 11.5px; margin-top: 3px; }
  .msg { border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; font-size: 13px; display: none; }
  .msg.show { display: block; }
  .err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 6px; }
  .actions .left { margin-right: auto; }
  button { font: inherit; font-weight: 500; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; color: #334155; }
  button.primary { background: #16a34a; border-color: #16a34a; color: #fff; }
  button.link { border: 0; background: none; color: #15803d; padding: 0; font-size: 12.5px; }
  button:disabled { opacity: .55; cursor: default; }
  #adminBox { display: none; }
</style>
</head>
<body>
<main>
  <h1>Connection settings</h1>
  <p class="lead">ZK Attendance keeps its data in MySQL. Enter where your MySQL server is. Devices, BioTime and sync are set later on the dashboard’s <b>Settings</b> page.</p>

  <div id="msg" class="msg"></div>

  <form id="form" autocomplete="off">
    <fieldset>
      <legend>MySQL database</legend>
      <div class="row">
        <label><span>Server</span><input name="host" required placeholder="127.0.0.1" /></label>
        <label><span>Port</span><input name="dbport" type="number" min="1" max="65535" required /></label>
      </div>
      <div class="row">
        <label><span>User</span><input name="user" required /></label>
        <label><span>&nbsp;</span></label>
      </div>
      <label><span>Password</span><input name="password" type="password" /><small id="pwHint">The MySQL password for this user (XAMPP: often empty).</small></label>
      <label><span>Database name</span><input name="database" required pattern="[A-Za-z0-9_]+" /><small>Created automatically if it doesn’t exist.</small></label>
    </fieldset>

    <fieldset id="adminBox">
      <legend>First admin account</legend>
      <label><span>Password for user “admin”</span><input name="adminPassword" type="password" minlength="8" /><small>New database: this creates the first dashboard login (username <b>admin</b>). At least 8 characters.</small></label>
    </fieldset>

    <fieldset>
      <legend>Dashboard</legend>
      <label><span>Port</span><input name="port" type="number" min="1" max="65535" required /><small>The dashboard opens on http://localhost:&lt;port&gt;. Other PCs and phones on your network can use http://&lt;this PC’s IP&gt;:&lt;port&gt;.</small></label>
    </fieldset>

    <div class="actions">
      <button type="button" class="link left" id="logs">Open log folder</button>
      <button type="button" id="test">Test connection</button>
      <button type="submit" class="primary" id="save">Save and start</button>
    </div>
  </form>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const form = $('#form');
  const msg = $('#msg');

  function show(text, ok) {
    msg.textContent = text || '';
    msg.className = 'msg ' + (text ? 'show ' : '') + (ok ? 'ok' : 'err');
  }
  function values() {
    const f = new FormData(form);
    return {
      db: { host: f.get('host'), port: f.get('dbport'), user: f.get('user'), password: f.get('password'), database: f.get('database') },
      port: f.get('port'),
      adminPassword: f.get('adminPassword'),
    };
  }
  function busy(on) {
    for (const b of document.querySelectorAll('button')) b.disabled = on;
  }

  async function init() {
    const s = await window.desktop.get();
    form.host.value = s.db.host;
    form.dbport.value = s.db.port;
    form.user.value = s.db.user;
    form.database.value = s.db.database;
    form.port.value = s.port;
    if (s.passwordSet) {
      form.password.placeholder = '••••••••';
      $('#pwHint').textContent = 'Saved. Leave empty to keep it.';
    }
    if (s.error) show(s.error, false);
  }

  // The server failed to start after "Save and start": show why and let the user fix it
  window.desktop.onState((state) => {
    busy(false);
    show(state.error, false);
  });

  $('#test').addEventListener('click', async () => {
    busy(true);
    show('Testing…', true);
    const r = await window.desktop.test(values());
    busy(false);
    show(r.message, r.ok);
    $('#adminBox').style.display = r.ok && !r.hasUsers ? 'block' : $('#adminBox').style.display;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    busy(true);
    show('Saving and starting the server…', true);
    const r = await window.desktop.save(values());
    if (!r.ok) {
      busy(false);
      if (r.needsAdmin) {
        $('#adminBox').style.display = 'block';
        form.adminPassword.focus();
      }
      show(r.message, false);
    }
    // On success the main process starts the server and closes this window
  });

  $('#logs').addEventListener('click', () => window.desktop.openLogs());
  init();
</script>
</body>
</html>
